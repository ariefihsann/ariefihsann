  </defs>
  <rect x="1" y="1" width="798" height="398" rx="26" fill="url(#bg)" stroke="#2f81f7" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="726" cy="26" r="150" fill="#2f81f7" opacity="0.07"/>
  <circle cx="640" cy="330" r="90" fill="#2f81f7" opacity="0.05"/>
