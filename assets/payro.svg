      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0f2a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#79b8ff"/>
